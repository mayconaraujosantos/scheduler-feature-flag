version: '3.8'
services:
  node-red:
    image: nodered/node-red:latest
    ports:
      - '1880:1880'
    volumes:
      - ../../node-red-data:/data
    environment:
      - NODE_RED_ENABLE_PROJECTS=true
    networks:
      - app-network

  json-server:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../mock-api:/app
    ports:
      - '3000:3000'
    command: >
      sh -c "npm install -g json-server &&
             json-server --watch db.json --host 0.0.0.0 --port 3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
